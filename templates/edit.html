<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>Edit Job Application</h1>
    </header>

    <main>

        <section class="applications">

            <h2>Update Application</h2>

            <form action="/edit/{{ application['id'] }}" method="POST">

                <label for="company">Company</label>
                <input type="text" id="company" name="company"
                       value="{{ application['company'] }}" required>

                <label for="position">Position</label>
                <input type="text" id="position" name="position"
                       value="{{ application['position'] }}" required>

                <label for="location">Location</label>
                <input type="text" id="location" name="location"
                       value="{{ application['location'] }}">

                <label for="date">Date Applied</label>
                <input type="date" id="date" name="date"
                       value="{{ application['date_applied'] }}">

                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="Applied"
                        {% if application['status'] == 'Applied' %}selected{% endif %}>
                        Applied
                    </option>

                    <option value="Interview"
                        {% if application['status'] == 'Interview' %}selected{% endif %}>
                        Interview
                    </option>

                    <option value="Rejected"
                        {% if application['status'] == 'Rejected' %}selected{% endif %}>
                        Rejected
                    </option>

                    <option value="Offer"
                        {% if application['status'] == 'Offer' %}selected{% endif %}>
                        Offer
                    </option>
                </select>

                <label for="url">Job URL</label>
                <input type="url" id="url" name="url"
                       value="{{ application['url'] }}">

                <label for="notes">Notes</label>
                <textarea id="notes" name="notes">{{ application['notes'] }}</textarea>

                <button type="submit">Save Changes</button>

            </form>

            <br>

            <a href="/">Back to Applications</a>

        </section>

    </main>

</body>
</html>
